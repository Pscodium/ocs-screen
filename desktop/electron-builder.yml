appId: com.ocsscreen.app
productName: Screen Share
directories:
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
publish:
  provider: github
  owner: Pscodium
  repo: ocs-screen
