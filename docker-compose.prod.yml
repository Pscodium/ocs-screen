services:
  livekit:
    image: livekit/livekit-server:latest
    # Sem mount de arquivo (EasyPanel não expõe Files/Mounts nesse plano): o yaml é escrito
    # dentro do container a partir das env vars configuradas no app. LIVEKIT_TURN_DOMAIN precisa
    # apontar (DNS A/AAAA) pro IP desta VPS.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/livekit.yaml <<EOF
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
        turn:
          enabled: true
          domain: ${LIVEKIT_TURN_DOMAIN}
          udp_port: 3478
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        EOF
        exec /livekit-server --config /tmp/livekit.yaml
    # 7880 (HTTP/WS de signaling) não precisa de bind de porta no host — o proxy do EasyPanel
    # alcança o container pela rede interna; mapeie o domínio livekit.* pra porta 7880 na UI dele.
    expose:
      - "7880"
    # RTC/TURN são protocolos crus (TCP/UDP, não HTTP) — não passam pelo proxy do EasyPanel,
    # por isso esses aqui precisam mesmo de porta real publicada no host.
    ports:
      - "7881:7881" # RTC via TCP — fallback quando UDP está bloqueado
      - "3478:3478/udp" # TURN/STUN (UDP) — TURN sobre TLS (5349) desativado, exige cert que não temos como montar
      - "50000-50100:50000-50100/udp" # faixa de portas RTC (mídia WebRTC em si)
    restart: unless-stopped

  # TURN pro pipeline NATIVO (libdatachannel, ver docs/NATIVE_CAPTURE.md Fase 4) — separado do TURN
  # embutido do LiveKit acima (`turn.enabled` no livekit.yaml gerado), que só serve o caminho
  # LiveKit. Porta 3479 (NÃO 3478) de propósito — o LiveKit já publica 3478/udp nesta mesma VPS,
  # os dois processos não podem escutar a mesma porta no host. `TURN_SECRET` aqui TEM que ser
  # exatamente o mesmo valor da env `TURN_SECRET` do serviço `backend` abaixo (services/turn.ts
  # gera a credencial com esse segredo, coturn valida com o mesmo).
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    environment:
      TURN_SECRET: ${TURN_SECRET}
      TURN_REALM: ${TURN_REALM:-ocs-screen}
    command: >
      -n
      --listening-port=3479
      --min-port=49160
      --max-port=49560
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --realm=${TURN_REALM:-ocs-screen}
      ${TURN_EXTERNAL_IP:+--external-ip=${TURN_EXTERNAL_IP}}
      --no-cli
      --no-multicast-peers
      --log-file=stdout
    # Protocolo cru (TCP/UDP, não HTTP) — não passa pelo proxy do EasyPanel, precisa de porta
    # real publicada no host (mesmo padrão do bloco de TURN/RTC do LiveKit acima).
    ports:
      - "3479:3479/udp"
      - "3479:3479/tcp"
      - "49160-49560:49160-49560/udp"

  backend:
    build:
      context: ./backend
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      CORS_ORIGIN: ${VIEWER_URL}
      VIEWER_URL: ${VIEWER_URL}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      TURN_SECRET: ${TURN_SECRET}
      TURN_REALM: ${TURN_REALM:-ocs-screen}
      TURN_URLS: ${TURN_URLS}
    # API é só HTTP — proxy do EasyPanel alcança pela rede interna; mapeie o domínio pra porta 4000 na UI.
    expose:
      - "4000"
    depends_on:
      - livekit
      - coturn
    restart: unless-stopped

  viewer:
    build:
      context: ./viewer
      args:
        VITE_BACKEND_URL: ${BACKEND_URL}
    # Site é só HTTP — proxy do EasyPanel alcança pela rede interna; mapeie o domínio pra porta 80 na UI.
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
