services:
  livekit:
    image: livekit/livekit-server:latest
    # Sem mount de arquivo (EasyPanel não expõe Files/Mounts nesse plano): o yaml é escrito
    # dentro do container a partir das env vars configuradas no app. LIVEKIT_TURN_DOMAIN precisa
    # apontar (DNS A/AAAA) pro IP desta VPS.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/livekit.yaml <<EOF
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
        turn:
          enabled: true
          domain: ${LIVEKIT_TURN_DOMAIN}
          udp_port: 3478
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        EOF
        exec /livekit-server --config /tmp/livekit.yaml
    # 7880 (HTTP/WS de signaling) não precisa de bind de porta no host — o proxy do EasyPanel
    # alcança o container pela rede interna; mapeie o domínio livekit.* pra porta 7880 na UI dele.
    expose:
      - "7880"
    # RTC/TURN são protocolos crus (TCP/UDP, não HTTP) — não passam pelo proxy do EasyPanel,
    # por isso esses aqui precisam mesmo de porta real publicada no host.
    ports:
      - "7881:7881" # RTC via TCP — fallback quando UDP está bloqueado
      - "3478:3478/udp" # TURN/STUN (UDP) — TURN sobre TLS (5349) desativado, exige cert que não temos como montar
      - "50000-50100:50000-50100/udp" # faixa de portas RTC (mídia WebRTC em si)
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      CORS_ORIGIN: ${VIEWER_URL}
      VIEWER_URL: ${VIEWER_URL}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    # API é só HTTP — proxy do EasyPanel alcança pela rede interna; mapeie o domínio pra porta 4000 na UI.
    expose:
      - "4000"
    depends_on:
      - livekit
    restart: unless-stopped

  viewer:
    build:
      context: ./viewer
      args:
        VITE_BACKEND_URL: ${BACKEND_URL}
    # Site é só HTTP — proxy do EasyPanel alcança pela rede interna; mapeie o domínio pra porta 80 na UI.
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
