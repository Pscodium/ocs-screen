<!doctype html>
<!-- Fonte de teste de sincronia A/V ("relógio"): a cada 1s, a tela pisca branco e toca um bipe de
     1kHz NO MESMO instante. Transmitir esta janela e medir no espectador a diferença entre o bipe
     ouvido e o flash exibido (e2e-run.js com AV_CLOCK=1). Abrir no Chrome com
     --autoplay-policy=no-user-gesture-required. O quadrado que anda mantém a captura entregando
     frames entre os flashes. -->
<meta charset="utf-8" />
<title>AVCLOCK</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #sq { position: absolute; top: 10px; width: 20px; height: 20px; background: #444; }
</style>
<div id="sq"></div>
<script>
  const ctx = new AudioContext();
  const sq = document.getElementById("sq");
  let nextFlashAt = performance.now() + 1000;
  let flashUntil = 0;
  function beep() {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 1000;
    gain.gain.value = 0.5;
    osc.connect(gain).connect(ctx.destination);
    // Agora no relógio de RENDER do áudio — é o que o loopback do processo captura (antes da
    // latência de saída do dispositivo), assim como a captura de tela pega o frame composto.
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.08);
  }
  function frame(now) {
    if (now >= nextFlashAt) {
      nextFlashAt += 1000;
      flashUntil = now + 100;
      beep();
    }
    document.body.style.background = now < flashUntil ? "#fff" : "#000";
    sq.style.left = `${(now / 4) % (innerWidth - 20)}px`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
