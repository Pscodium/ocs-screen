server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota (ex.: /s/AbC123) cai no index.html, o React Router assume.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html e version.json sempre revalidados — sem isso o navegador guarda o index.html velho
    # (cache heurístico) e continua carregando os assets da versão anterior até um Ctrl+F5.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
